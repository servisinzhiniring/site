<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СервисИнжиниринг | Электромонтаж и строительство</title>
    <style>
        body { font-family: 'Arial', sans-serif; margin: 0; padding: 0; color: #333; line-height: 1.6; }
        .container { width: 90%; max-width: 1200px; margin: 0 auto; padding: 20px 0; }
        header { background: linear-gradient(135deg, #00509d 0%, #002147 100%); color: white; padding: 60px 0; text-align: center; }
        h1 { font-size: 2.5em; margin-bottom: 15px; display: none; } /* Скрываем текстовый заголовок */
        .subtitle { font-size: 1.2em; opacity: 0.9; margin-bottom: 30px; }
        .btn { background-color: #ffc107; color: #000; padding: 15px 30px; text-decoration: none; font-weight: bold; border-radius: 5px; transition: background 0.3s; }
        .btn:hover { background-color: #e0a800; }
        section { padding: 60px 0; }
        h2 { text-align: center; font-size: 2em; margin-bottom: 40px; color: #002147; }
        .services-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .service-card { background: #f8f9fa; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .service-card h3 { color: #00509d; margin-top: 0; }
        .advantages { background-color: #f0f4f8; }
        .adv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .adv-item { text-align: center; padding: 20px; }
        .portfolio { text-align: center; }
        .portfolio-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 30px; }
        .portfolio-item { background: #e9ecef; height: 200px; display: flex; align-items: center; justify-content: center; color: #666; border-radius: 10px; font-style: italic; }
        .contacts { background: #002147; color: white; }
        form { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
        input, textarea { padding: 15px; border: 1px solid #ccc; border-radius: 5px; font-size: 1em; width: 100%; box-sizing: border-box; }
        button { background-color: #ffc107; border: none; color: #000; padding: 15px; font-weight: bold; cursor: pointer; border-radius: 5px; transition: background 0.3s; }
        button:hover { background-color: #e0a800; }
        footer { background: #212529; color: white; text-align: center; padding: 20px 0; }
        @media (max-width: 768px) { .services-grid, .adv-grid { grid-template-columns: 1fr; } h1 { font-size: 2em; } }
    </style>
</head>
<body>

<header>
    <div class="container">
        <!-- Логотип -->
