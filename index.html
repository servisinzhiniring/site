<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сервис Инжиниринг — электромонтаж и общестроительные работы, Тобольск</title>
<meta name="description" content="Электромонтажные и общестроительные работы в Тобольске. Тюменская область, 9 микрорайон, строение 2. Пн–Пт 8:00–17:00.">
<style>
  :root{
    --accent:#ffc107;
    --dark:#1f2430;
    --ink:#0a0d14;
    --muted:#5b6472;
    --bg:#f4f5f7;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6}
  a{color:var(--dark);text-decoration:none}
  img{max-width:100%;display:block}
  .wrap{max-width:1100px;margin:0 auto;padding:0 20px}

  /* Шапка */
  header{background:var(--dark);color:#fff;padding:18px 0}
  header .wrap{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
  .logo{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:800;letter-spacing:.5px}
  .logo img{height:36px;width:auto}
  .logo em{font-style:italic;color:#fff}
  nav a{color:#cfd6e0;margin-left:22px;font-size:15px;font-weight:600}
  nav a:hover{color:var(--accent)}

  /* Hero */
  .hero{background:var(--dark);color:#fff;padding:70px 0 60px;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;inset:0;background:url("https://images.unsplash.com/photo-1621905232091-2c2a8b8f0c0e?w=1600&q=80") center/cover;opacity:.18}
  .hero .inner{position:relative;z-index:2;display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center}
  .hero h1{font-size:40px;line-height:1.15;margin-bottom:18px}
  .hero p{font-size:17px;color:#c6cedb;max-width:55ch;margin-bottom:28px}
  .btn{display:inline-block;background:var(--accent);color:#1a1d26;font-weight:800;padding:14px 30px;border-radius:6px;font-size:16px}
  .btn:hover{background:#ffd54a}
  .hero-photos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .hero-photos img{border-radius:8px;min-height:180px;object-fit:cover;width:100%}

  /* Секции */
  section{padding:64px 0}
  .section-head{text-align:center;margin-bottom:44px}
  .section-head h2{font-size:30px;color:var(--dark)}
  .section-head p{color:var(--muted);margin-top:8px;max-width:36ch;margin-left:auto;margin-right:auto}

  /* Услуги */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 10px rgba(10,13,20,.06);padding-bottom:22px}
  .card img{height:190px;object-fit:cover}
  .card h3{padding:16px 20px 6px;font-size:19px}
  .card p{padding:0 20px;color:var(--muted);font-size:15px}

  /* О компании / фото-лента */
  .about{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
  .about img{border-radius:12px;min-height:320px;object-fit:cover}
  .about h2{font-size:28px;margin-bottom:14px}
  .about p{color:var(--muted);margin-bottom:12px}

  /* Контакты */
  .contacts{background:var(--dark);color:#fff}
  .contacts .section-head h2{color:#fff}
  .contacts .section-head p{color:#aab3c0}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;text-align:center}
  .c-card{background:#2a2f3d;border-radius:10px;padding:26px 18px}
  .c-card .ic{font-size:26px;margin-bottom:10px}
  .c-card h4{font-size:17px;margin-bottom:6px}
  .c-card p{font-size:14px;color:#b9c1cf}
  .c-card a{color:var(--accent);font-weight:600}

  footer{background:#141720;color:#8b93a3;text-align:center;padding:24px 0;font-size:14px}

  @media(max-width:860px){
    .hero .inner,.about{grid-template-columns:1fr}
    .grid,.cards{grid-template-columns:1fr}
    .hero h1{font-size:30px}
    header nav{width:100%;display:flex;justify-content:space-between}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="logo">
